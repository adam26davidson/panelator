# The backend workspace (spec 111). Its own workspace: the root workspace excludes `backend/`.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.98"

[workspace.dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
bytes = "1.12.2"
ciborium-ll = "0.2.2"
clap = { version = "4.6.9", features = ["derive", "env"] }
futures-util = "0.3.34"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio", "service"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1.16.0", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tower = "0.5.3"
time = { version = "0.3", default-features = false, features = ["std"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tempfile = "3.27.0"
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "handshake"] }
x509-parser = { version = "0.18.1", features = ["verify"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
