# Spec 030 AC-2: every secret the system uses, what it is for and the exact access it has.
# No secret is here: the secrets are encrypted in the store (agents/scheduler.yaml `credentials.dir`).
# `check` is a command run through the entry's wrapper (exit 0 = works) for an entry with a wrapper, or
# `{ builtin: <name> }` for a `wrapper: none` entry: a probe the scheduler runs itself over the stored
# secret (spec 069 AC-1). `used_by` may name `scheduler` for a `wrapper: none` entry.
- name: github-app-key
  provider: github
  purpose: The GitHub App private key the scheduler signs with to mint the installation token in token.json.
  access:
    - issues (write)
    - pull requests (write)
    - contents (write)
    - checks (read)
    - actions (read)
    - metadata (read)
    - repository security advisories (write)
  used_by: [scheduler]
  wrapper: none
  expiry: none
  check: { builtin: github-app }
  renew: manual
  setup:
    - In GitHub, open the App's settings (Settings, Developer settings, GitHub Apps, the scheduler App).
    - Under "Private keys" choose "Generate a private key" and save the downloaded .pem.
    - Run `panelator-scheduler cred set github-app-key < <the .pem>`. It prints `check ok` when the key is registered for the App, and exits 1 with the reason when it is not.
    - Delete the .pem once the service has restarted and minted from the store, then delete the old key in the App's settings.
- name: telegram-bot
  provider: telegram
  purpose: The bot token and chat id of the Telegram channel (spec 007), stored as one JSON secret.
  access:
    - send and receive messages as the bot in the maintainer's one private chat
  used_by: [scheduler]
  wrapper: none
  expiry: none
  check: { builtin: telegram-get-me }
  renew: manual
  setup:
    - In Telegram open @BotFather, send /newbot, choose a display name and a username ending in bot, and copy the token.
    - Open a chat with the new bot and send /start, so the bot may message you.
    - Find the chat id with `curl -s "https://api.telegram.org/bot<token>/getUpdates" | jq '.result[-1].message.chat.id'` right after.
    - Run `echo '{"bot_token":"<token>","chat_id":<id>}' | panelator-scheduler cred set telegram-bot`; it prints `check ok` when the token works.
- name: aws-sso
  provider: aws
  purpose: The AWS CLI SSO session of the delivery-system account (spec 022 section 8).
  access:
    - sts:GetCallerIdentity
    - ce:GetCostAndUsage
    - lambda:PutFunctionConcurrency
    - lambda:DeleteFunctionConcurrency
    - cloudfront:GetDistributionConfig
    - cloudfront:UpdateDistribution
    - dynamodb:DescribeTable
    - dynamodb:UpdateTable
  used_by: [infra-health]
  wrapper: { command: aws, env: AWS_PROFILE }
  expiry: { probe: "panelator-scheduler aws sso-expiry" }
  check: "aws sts get-caller-identity"
  renew: manual
  setup:
    - In IAM Identity Center create the permission set PanelatorDelivery with the inline policy of spec 022 section 8 (the actions above, on resources whose names start panelator-), and assign it to your user on the panelator-delivery account.
    - "Add to ~/.aws/config: [profile panelator-delivery] with sso_session = default, sso_account_id = <AccountId>, sso_role_name = PanelatorDelivery, region = us-east-2, output = json."
    - Run `aws sso login --sso-session default`.
    - Run `aws sts get-caller-identity --profile panelator-delivery` and confirm it prints the delivery account.
    - Run `panelator-scheduler cred set aws-sso` and type the profile name (panelator-delivery) on stdin.
    - Run `panelator-scheduler aws-check`.
