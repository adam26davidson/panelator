# The credential catalogue (spec 030 AC-2, as amended by spec 069 AC-1 and spec 068 AC-1).
# `check` is a command run through the wrapper (an entry with a wrapper) or `{ builtin: <name> }`,
# a probe the scheduler runs over the stored secret (an entry with `wrapper: none`).
- name: github-app-key
  provider: github
  purpose: The GitHub App private key the scheduler signs with to mint the installation token (spec 001 section 12).
  access:
    - "issues: write"
    - "pull requests: write"
    - "contents: write"
    - "workflows: write"
    - "checks: read"
    - "actions: write"
    - "metadata: read"
    - "repository security advisories: write"
    - "installed on adam26davidson/panelator only (repository_selection: selected)"
  used_by: [scheduler]
  wrapper: none
  expiry: none
  check: { builtin: github-app }
  renew: manual
  setup:
    - "1. Open the App's settings on GitHub (Settings, Developer settings, GitHub Apps, the panelator pipeline App)."
    - "2. Under Private keys, choose Generate a private key; GitHub downloads a .pem file."
    - "3. On the laptop run `panelator-scheduler cred set github-app-key < <the .pem>`. The command prints `check ok` when the key is registered for the App."
    - "4. Restart the service (`systemctl --user restart panelator-scheduler`), then delete the .pem and revoke the old key in the App's settings."
- name: telegram-bot
  provider: telegram
  purpose: The Telegram bot token and chat id of the maintainer channel (spec 007 AC-1), stored as one JSON secret.
  access:
    - "bot token of the panelator bot"
    - "the maintainer's chat id"
  used_by: [scheduler]
  wrapper: none
  expiry: none
  check: { builtin: telegram-get-me }
  renew: manual
  setup:
    - "1. In Telegram, open @BotFather, send /newbot, choose a display name and a username ending in `bot`. Copy the token BotFather returns."
    - "2. Open a chat with the new bot and send /start, so the bot may message you."
    - "3. Find the chat id: run `curl -s \"https://api.telegram.org/bot<token>/getUpdates\" | jq '.result[-1].message.chat.id'` right after step 2."
    - "4. Write `{ \"bot_token\": \"<token>\", \"chat_id\": <id> }` to a file and run `panelator-scheduler cred set telegram-bot < <the file>`, then delete the file."
- name: aws-sso
  provider: aws
  purpose: The AWS CLI SSO session of the delivery-system account (spec 022 section 8).
  access:
    - "sts:GetCallerIdentity"
    - "ce:GetCostAndUsage"
    - "lambda:PutFunctionConcurrency"
    - "lambda:DeleteFunctionConcurrency"
    - "cloudfront:GetDistributionConfig"
    - "cloudfront:UpdateDistribution"
    - "dynamodb:DescribeTable"
    - "dynamodb:UpdateTable"
  used_by: [infra-health]
  wrapper: { command: aws, env: AWS_PROFILE }
  expiry: { probe: "panelator-scheduler aws sso-expiry" }
  check: "aws sts get-caller-identity"
  renew: manual
  setup:
    - "1. In IAM Identity Center create the permission set `PanelatorDelivery` with the inline policy of spec 022 section 8 (plus the actions listed in this entry), assign it to your user for the `panelator-delivery` account, and set the access portal session to its maximum (90 days)."
    - "2. Add to `~/.aws/config`: `[profile panelator-delivery]` with `sso_session = default`, `sso_account_id = <AccountId>`, `sso_role_name = PanelatorDelivery`, `region = us-east-2`, `output = json`."
    - "3. Run `aws sso login --sso-session default`, then `aws sts get-caller-identity --profile panelator-delivery`."
    - "4. Run `panelator-scheduler cred set aws-sso` with the profile name (`panelator-delivery`) on stdin."
    - "5. Run `panelator-scheduler aws-check`."
