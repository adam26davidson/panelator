# Spec 030 AC-2: every secret the system uses, what it is for and the exact access it has.
# No secret is here. The secrets are encrypted in the store (agents/scheduler.yaml `credentials.dir`).
# `check` is a command run through the entry's wrapper (exit 0 = works) or `builtin:<name>`, a check the
# scheduler runs itself because the secret never leaves its process. `used_by` may name `scheduler`.
github-app-key:
  provider: github
  purpose: The GitHub App private key the scheduler signs with to mint the installation token in token.json.
  access:
    - issues (write)
    - pull requests (write)
    - contents (write)
    - workflows (write)
    - checks and actions (read)
    - metadata (read)
    - repository security advisories (write)
  used_by: [scheduler]
  wrapper: none
  expiry: none
  check: gh api /installation/repositories --jq .total_count
  renew: manual
  setup:
    - In GitHub, open the App's settings (Settings, Developer settings, GitHub Apps, panelator scheduler).
    - Under "Private keys" choose "Generate a private key" and save the downloaded .pem.
    - Run `pnpm -F @panelator/scheduler exec panelator-scheduler cred set github-app-key < the-key.pem`.
    - Delete the .pem, then delete the old key in the App's settings.
telegram-bot:
  provider: telegram
  purpose: The bot token and chat id of the Telegram channel (spec 007), stored as one JSON secret.
  access:
    - send and receive messages as the bot in the maintainer's one private chat
  used_by: [scheduler]
  wrapper: none
  expiry: none
  check: builtin:telegram-get-me
  renew: manual
  setup:
    - In Telegram open @BotFather, send /newbot, choose a name and a username ending in bot, and copy the token.
    - Open a chat with the new bot and send /start.
    - Find the chat id with `curl -s "https://api.telegram.org/bot<token>/getUpdates" | jq '.result[-1].message.chat.id'`.
    - Run `echo '{"bot_token":"<token>","chat_id":<id>}' | panelator-scheduler cred set telegram-bot`.
    - Run `panelator-scheduler cred check telegram-bot`; it must print ok.
