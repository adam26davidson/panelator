# Read once at service start (spec section 14). Everything else is fetched from main at runtime.
repo: adam26davidson/panelator
maintainer: adam26davidson
app:
  id: 5343912
  installation_id: 172040609
  private_key_path: ~/.config/panelator/scheduler-app.pem
  bot_login: panelator-pipeline[bot]
telegram:
  credentials_path: ~/.config/panelator/telegram.json
  long_poll_timeout_s: 50
poll_interval_s: 45
slots: 1
liveness_hours: 2
retry_cost_limit_usd: 1.0
rescue_model: claude-fable-5-1   # strongest model, for rescue attempts (spec 006)
notify_rate_limit_hours: 4
bounds:
  design_revisions: 2        # design stage reruns after a merge whose gate still fails (spec 029 AC-4)
required_checks: [test]
state_dir: ~/.local/state/panelator-scheduler
labels:
  priority: priority
  stops_pipeline: stops-pipeline   # agent-set: recurrence stops every run or every PR (spec 063)
  feature_classes: [class:product]
  debt_classes: [class:bug, class:tooling, class:dependency]
systemd:
  scope: true                # wrap stages in systemd-run --user --scope
  inhibit: true              # hold systemd-inhibit while a stage is in flight
# credentials:                # spec 030 AC-1: the encrypted store `cred set` writes; both keys are optional
#   dir: ~/.config/panelator/credentials
#   warn_days: 7
# aws:                        # spec 022 AC-1: the delivery-system AWS account; absent means AWS is off
#   profile: panelator-delivery   # AWS CLI profile (default)
#   account_id: "<twelve digits>"
#   region: us-east-2             # default
#   pull_interval_h: 24           # default, min 6
decide:
  base_url: ""               # /v1/systemone; unused in v0
  key_env: PANELATOR_DECIDE_KEY
