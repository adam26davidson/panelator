set_parameter:
  level: 1
  description: Change an auto parameter within its limits.
pause_agent:
  level: 1
  description: Pause a standing agent.
resume_agent:
  level: 1
  description: Resume an agent unless the maintainer paused it.
run_agent:
  level: 1
  description: Mark an agent due now.
rerun_workflow:
  level: 1
  description: "Re-run a workflow at most once per day; needs the App's actions: write permission (spec 001 section 12)."
undo:
  level: 1
  description: Reverse a recorded reversible action.
sweep_volume:
  level: 1
  description: "Remove stale leftovers the system created on a checked volume: leaked test roots and orphaned worktrees."
cred_set:
  level: 1
  description: Store a credential read from stdin and run its check (maintainer command only).
cred_check:
  level: 1
  description: Run a credential's check and record the result in the store's index (maintainer command only).
cred_import:
  level: 1
  description: Store the credential held in its configuration file and run its check (maintainer command only).
cred_remove:
  level: 1
  description: Delete a stored credential and its index entry (maintainer command only).
renew_credential:
  level: 1
  description: Run a catalogue entry's renew command through its wrapper, check the credential and record its new expiry (the secret is never in the request).
aws_scale:
  level: 1
  description: Move a ledger reservation between the two states its launcher described, within the AWS cap.
