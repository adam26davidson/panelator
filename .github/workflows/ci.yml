name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 26, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # a restored pnpm store skips the package's install script, which is what downloads the browser
      - run: pnpm -F @panelator/design-stage exec playwright-core install chromium-headless-shell
      - run: pnpm test
      - run: pnpm -F @panelator/scheduler typecheck
