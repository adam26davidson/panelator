name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 26, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Chromium and its system libraries, every run; the browser is not cached (spec 054).
      - run: pnpm -F @panelator/design-stage exec playwright-core install --with-deps chromium
      - run: pnpm test
      - run: pnpm -F @panelator/scheduler typecheck
      - run: pnpm -F @panelator/design-stage lint
      # The Rust checks of product spec 13 (spec 107): the toolchain rust-toolchain.toml pins, with
      # its components and the wasm32-unknown-unknown target.
      - run: rustup toolchain install
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        id: cargo-tools
        with:
          path: |
            ~/.cargo/bin/cargo-nextest
            ~/.cargo/bin/cargo-deny
          key: cargo-tools-${{ runner.os }}-nextest-0.9.152-deny-0.22.0
      - if: steps.cargo-tools.outputs.cache-hit != 'true'
        run: cargo install --locked --version 0.9.152 cargo-nextest && cargo install --locked --version 0.22.0 cargo-deny
      - run: sdk/rust/check.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spike-widgets
          path: |
            target/widgets/spike-clock.wasm
            target/widgets/spike-scroll.wasm
            target/widgets/spike-image.wasm
          if-no-files-found: error
