name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 26, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Chromium and its system libraries, every run; the browser is not cached (spec 054).
      - run: pnpm -F @panelator/design-stage exec playwright-core install --with-deps chromium
      - run: pnpm test
      - run: pnpm -F @panelator/scheduler typecheck
      - run: pnpm -F @panelator/design-stage lint
      # The firmware (spec 106): host checks on every run, the container build when firmware or workflows changed.
      - name: Install the clang tools when missing
        run: |
          if ! command -v clang-format-18 >/dev/null || ! command -v clang-tidy-18 >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y clang-format-18 clang-tidy-18
          fi
      - name: Firmware host checks
        run: firmware/scripts/check-host.sh
      - name: Does the change touch the firmware or the workflows?
        id: firmware_changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git diff --name-only "$BASE_SHA" HEAD | grep -qE '^(firmware/|\.github/workflows/)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Firmware build in the pinned container
        if: steps.firmware_changes.outputs.build == 'true'
        env:
          PANELATOR_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: firmware/scripts/build.sh
