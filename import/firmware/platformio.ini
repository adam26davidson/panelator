[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; N16R8: 16MB flash, 8MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = partitions_hub75.csv
board_build.filesystem = littlefs

; Serial goes to UART0 (the CH340 USB-TTL port on the devkit).
; If you want to switch to the native USB-OTG port later, add
; -DARDUINO_USB_CDC_ON_BOOT=1 and monitor the /dev/cu.usbmodem* port.
build_flags =
    -DBOARD_HAS_PSRAM

lib_deps =
    adafruit/Adafruit GFX Library
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display

monitor_speed = 115200

; Network flashing via ArduinoOTA. Usage:
;   HUB75_OTA_PASS=<password from config.h> pio run -e esp32-s3-ota -t upload
; CI does the same thing with tools/espota.py directly (no PlatformIO
; needed on the runner) — see .github/workflows/firmware.yml at the
; repo root.
[env:esp32-s3-ota]
extends = env:esp32-s3-devkitc-1
upload_protocol = espota
upload_port = hub75-panel.local
upload_flags = --auth=${sysenv.HUB75_OTA_PASS}
