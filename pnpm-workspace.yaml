packages:
  - "tools/*"
  - "web"
  - "sdk/assemblyscript"
allowBuilds:
  esbuild: true
  "@playwright/browser-chromium": true
# One toolchain version for tools/design-stage, console/ and web/ (design-tree R5.Q4); one bump moves all three.
catalog:
  react: ^19.3.1
  react-dom: ^19.3.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  vite: ^8.3.5
  "@vitejs/plugin-react": ^6.1.2
  typescript: ^7.0.2
  "@biomejs/biome": ^2.6.4
  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  vitest: ^3.2.4
  playwright-core: 1.64.1
  "@playwright/browser-chromium": 1.64.1
  storybook: ^10.6.5
  "@storybook/react-vite": ^10.6.5
  knip: ^6.44.1
minimumReleaseAgeExclude:
  - knip@6.44.1
