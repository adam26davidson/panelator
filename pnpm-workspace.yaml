packages:
  - "tools/*"
  - "web"
  - "web/simulator"
  - "console"
  - "sdk/assemblyscript"
# A script installs a missing or stale node_modules first, under any pnpm (spec 035).
verifyDepsBeforeRun: install
allowBuilds:
  esbuild: true
  "@playwright/browser-chromium": true
# One toolchain version for tools/design-stage, console/ and web/ (design-tree R5.Q4); one bump moves all three.
catalog:
  react: ^19.3.1
  react-dom: ^19.3.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  vite: ^8.3.5
  "@vitejs/plugin-react": ^6.1.2
  typescript: ^7.0.2
  "@biomejs/biome": ^2.6.4
  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  vitest: ^3.2.4
  playwright-core: 1.64.1
  "@playwright/browser-chromium": 1.64.1
  storybook: ^10.6.5
  "@storybook/react-vite": ^10.6.5
  knip: ^6.44.1
  # Named by spec 051 (Testing Library in section 3; the AWS clients and Lambda types for console/api/); one version for every UI package.
  "@testing-library/react": ^16.3.0
  jsdom: ^27.0.0
  "@aws-sdk/client-dynamodb": ^3.900.0
  "@aws-sdk/client-ssm": ^3.900.0
  "@types/aws-lambda": ^8.10.150
  # Named by spec 112 (the web app): one version of each for console/ and web/.
  "@tanstack/react-router": ^1.130.0
  "@tanstack/react-query": ^5.90.0
  zustand: ^5.1.0
  steiger: ^0.10.0
  "@feature-sliced/steiger-plugin": ^0.8.2
  "@testing-library/user-event": ^14.6.1
  "@playwright/test": 1.64.1
minimumReleaseAgeExclude:
  - knip@6.44.1
