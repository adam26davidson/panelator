# The workspace of the SDK, the test host and the widgets. The backend keeps its own workspace
# (backend/) and the firmware is built by ESP-IDF; both are excluded.
[workspace]
resolver = "3"
members = ["sdk/rust/panelator-widget", "sdk/rust/test-host", "widgets/spike-clock", "widgets/spike-scroll", "widgets/spike-image"]
exclude = ["backend", "firmware"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"
publish = false
rust-version = "1.98"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[workspace.lints.rust]
missing_docs = "warn"

# The widgets are built in release mode for wasm32-unknown-unknown (sdk/rust/build-widgets.sh).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The test host runs modules in an interpreter; keep it quick in debug test runs too.
[profile.dev.package."*"]
opt-level = 2
